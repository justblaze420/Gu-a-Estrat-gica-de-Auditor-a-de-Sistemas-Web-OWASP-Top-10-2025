<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Auditoría de Seguridad Interactiva</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --crit: #ff4d4d; --high: #ffa500; --med: #ffff00; --low: #38bdf8; --bg: #0f172a; --card: #1e293b; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: var(--card); border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .btn-load { background: #38bdf8; color: #0f172a; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #fileInput { display: none; }
        
        /* Tabla y Acordeón */
        .vuln-item { background: var(--card); border: 1px solid #334155; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
        .vuln-header { padding: 15px; cursor: pointer; display: grid; grid-template-columns: 120px 1fr 100px; align-items: center; transition: background 0.2s; }
        .vuln-header:hover { background: #2d3e5a; }
        .vuln-details { padding: 20px; background: #0f172a; border-top: 1px solid #334155; display: none; }
        
        /* Severidades */
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; text-align: center; color: #000; }
        .bg-CRITICAL { background: var(--crit); }
        .bg-HIGH { background: var(--high); }
        .bg-MEDIUM { background: var(--med); }
        .bg-LOW { background: var(--low); }
        
        .code-block { background: #000; color: #00ff00; padding: 15px; border-radius: 6px; font-family: monospace; overflow-x: auto; margin: 10px 0; border: 1px solid #334155; }
        .search-bar { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: var(--card); color: white; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛡️ Horusec Pro Dashboard</h1>
            <label class="btn-load">📁 CARGAR REPORTE<input type="file" id="fileInput"></label>
        </div>

        <div id="statsGrid" style="display:none; display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 20px;">
            <div class="card" style="background:var(--card); padding:20px; border-radius:12px;"><canvas id="severityChart"></canvas></div>
            <div id="summaryText" style="background:var(--card); padding:20px; border-radius:12px; font-size: 1.1rem;"></div>
        </div>

        <input type="text" id="search" class="search-bar" placeholder="Buscar por archivo, detalle o severidad...">
        <div id="vulnList"></div>
    </div>

    <script>
        const severityOrder = { "CRITICAL": 4, "HIGH": 3, "MEDIUM": 2, "LOW": 1, "INFO": 0 };
        let chartInstance = null;

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function() {
                try {
                    const data = JSON.parse(reader.result);
                    // Extraer vulnerabilidades del nuevo formato
                    let list = data.analysisVulnerabilities || [];
                    let vulns = list.map(item => item.vulnerabilities).filter(v => v);
                    
                    // ORDENAR POR CRITICIDAD
                    vulns.sort((a, b) => (severityOrder[b.severity] || 0) - (severityOrder[a.severity] || 0));

                    document.getElementById('statsGrid').style.display = 'grid';
                    renderStats(vulns);
                    renderList(vulns);
                } catch (err) {
                    alert("Error: El formato del JSON no es el esperado o está incompleto.");
                }
            };
            reader.readAsText(e.target.files[0]);
        });

        function renderStats(vulns) {
            const counts = vulns.reduce((acc, v) => { acc[v.severity] = (acc[v.severity] || 0) + 1; return acc; }, {});
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(document.getElementById('severityChart'), {
                type: 'pie',
                data: {
                    labels: Object.keys(counts),
                    datasets: [{ data: Object.values(counts), backgroundColor: ['#ff4d4d', '#ffa500', '#ffff00', '#38bdf8'] }]
                },
                options: { plugins: { legend: { labels: { color: 'white' } } } }
            });
            document.getElementById('summaryText').innerHTML = `
                <h2>Análisis Finalizado</h2>
                <p>Total de hallazgos detectados: <strong>${vulns.length}</strong></p>
                <p>Severidad máxima encontrada: <span style="color:var(--crit)">${vulns[0]?.severity || 'N/A'}</span></p>
                <p>Tip: Haz clic en cualquier fila para ver el código afectado.</p>
            `;
        }

        function renderList(vulns) {
            const container = document.getElementById('vulnList');
            container.innerHTML = '';

            vulns.forEach((v, index) => {
                const item = document.createElement('div');
                item.className = 'vuln-item';
                item.innerHTML = `
                    <div class="vuln-header" onclick="toggleDetails(${index})">
                        <span class="badge bg-${v.severity}">${v.severity}</span>
                        <span style="padding-left:10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${v.file} : <strong>${v.line}</strong></span>
                        <span style="text-align:right; color:#94a3b8;">#${index + 1}</span>
                    </div>
                    <div id="details-${index}" class="vuln-details">
                        <strong>Descripción:</strong> <p>${v.details.replace(/\n/g, '<br>')}</p>
                        <strong>Código Vulnerable:</strong>
                        <div class="code-block">${v.code.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
                        <small>Herramienta: ${v.securityTool} | Lenguaje: ${v.language}</small>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function toggleDetails(index) {
            const el = document.getElementById(`details-${index}`);
            el.style.display = (el.style.display === 'block') ? 'none' : 'block';
        }

        // Buscador dinámico
        document.getElementById('search').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.vuln-item').forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(term) ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
